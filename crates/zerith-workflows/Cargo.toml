[package]
name = "zerith-workflows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zerith global visual workflow engine, cron scheduler, and notification channels"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
ureq.workspace = true
thiserror.workspace = true
# Already in Cargo.lock (tauri/serde_with): OS local UTC offset incl. DST.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Código de pareamento do `zerith server` (remote.rs); já na árvore via ureq.
base64 = "0.22"
# Segredos `{{secret:nome}}` no cofre configurado (arquivo no servidor).
zerith-core = { path = "../zerith-core" }
# `<raiz>/inventory.toml` para a opção `device` do nó SSH.
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
