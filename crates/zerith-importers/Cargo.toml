[package]
name = "zerith-importers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zerith-core = { path = "../zerith-core" }
zerith-sessions = { path = "../zerith-sessions" }
zerith-skills = { path = "../zerith-skills" }
zerith-mcp = { path = "../zerith-mcp" }
# Migração completa: memória, `mentions_secret` e inventário de rede.
zerith-memory = { path = "../zerith-memory" }
zerith-security = { path = "../zerith-security" }
zerith-tools = { path = "../zerith-tools" }
# Fuso local (cron do Hermes é no fuso dele; o daemon do Zerith avalia em UTC).
zerith-workflows = { path = "../zerith-workflows" }
zerith-plugins = { path = "../zerith-plugins" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Já no Cargo.lock (por outras crates): hash do ledger de importação.
sha2 = "0.10"
# Já no Cargo.lock: valores secretos dentro de texto livre.
regex = "1"
# Já no Cargo.lock: o `.bundled_manifest` do Hermes guarda md5 por skill.
md-5 = "0.10"
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
