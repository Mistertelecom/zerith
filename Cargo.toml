[workspace]
resolver = "2"
members = [
    "crates/zerith-core",
    "crates/zerith-sessions",
    "crates/zerith-memory",
    "crates/zerith-cli",
    "crates/zerith-providers",
    "crates/zerith-runtime",
    "crates/zerith-importers",
    "crates/zerith-ui",
    "crates/zerith-skills",
    "crates/zerith-mcp",
    "crates/zerith-plugins",
    "crates/zerith-security",
    "crates/zerith-tools",
    "crates/zerith-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
anyhow = "1"
thiserror = "2"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
# Settings files.
toml = "1"
# OS credential store (Credential Manager / Keychain / kernel keyutils).
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
# No yaml crate: the Agent Skills frontmatter is small enough to parse by hand
# (see zerith-skills/frontmatter.rs), and one less dependency is one less CVE.

# The pinned MSVC toolset on this machine rejects /Z7 for the bundled SQLite
# build (cl.exe D8050). Debug info is not needed for the library/tests we ship,
# so dev builds compile without it. Remove when the toolset is fixed.
[profile.dev]
debug = false

# Rune's own vendored patches. A dependency's [patch] table does not apply to the
# workspace that depends on it, so every app that builds Rune patches these too.
# Copied verbatim from rune/vendor at rev bc05f817; refresh with
# scripts/vendor-*.sh in the Rune checkout when bumping the revision.
[patch.crates-io]
parley_engine = { path = "vendor/parley_engine" }
winit = { path = "vendor/winit" }
wgpu-hal = { path = "vendor/wgpu-hal" }
accesskit_windows = { path = "vendor/accesskit_windows" }
accesskit_macos = { path = "vendor/accesskit_macos" }
