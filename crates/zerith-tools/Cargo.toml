[package]
name = "zerith-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zerith-security = { path = "../zerith-security" }
# Media tools read the `media` settings and the OpenRouter key.
zerith-core = { path = "../zerith-core" }
zerith-skills = { path = "../zerith-skills" }
zerith-memory = { path = "../zerith-memory" }
# Only for `Cancel`: the token a turn shares between the stream and its tools.
zerith-providers = { path = "../zerith-providers" }
serde = { workspace = true }
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
walkdir = "2"
# Already in Cargo.lock (through other crates): grep patterns.
regex = "1"
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
# ConPTY for `terminal_*` (already in Cargo.lock through zerith-security).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
