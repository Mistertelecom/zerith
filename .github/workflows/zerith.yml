name: Zerith

# Cargo workspace (CLI, core crates, and Tauri 2 desktop app `zerith-desktop`)
# plus frontend TypeScript/Vite build verification.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: zerith-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # `zerith-desktop` is Tauri 2: on Linux it links WebKitGTK and GTK.
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: crates/zerith-desktop/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Typecheck and build
        working-directory: crates/zerith-desktop/frontend
        run: npm run build
      - name: Run frontend unit checks
        working-directory: crates/zerith-desktop/frontend
        run: |
          node --experimental-strip-types scripts/markdown.check.ts
          node --experimental-strip-types scripts/title.check.ts
          node --experimental-strip-types scripts/turn.check.ts
      - name: Smoke-test update signing script
        run: |
          set -euo pipefail
          out="$(node scripts/sign-update.mjs keygen)"
          pub="$(printf '%s\n' "$out" | sed -n 's/^ZERITH_UPDATE_PUBKEY=//p')"
          priv="$(printf '%s\n' "$out" | sed -n 's/^ZERITH_UPDATE_SIGNING_KEY=//p')"
          tmp="$(mktemp -d)"
          printf 'test-installer' > "${tmp}/Zerith_0.2.0_x64-setup.exe"
          ZERITH_UPDATE_SIGNING_KEY="$priv" node scripts/sign-update.mjs sign "${tmp}/Zerith_0.2.0_x64-setup.exe" "0.2.0"
          node scripts/sign-update.mjs verify "${tmp}/Zerith_0.2.0_x64-setup.exe" "0.2.0" "${tmp}/Zerith_0.2.0_x64-setup.exe.sig" "$pub"
          rm -rf "$tmp"
