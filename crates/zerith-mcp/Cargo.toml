[package]
name = "zerith-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zerith-core = { path = "../zerith-core" }
# Tool adapter only: tools -> security/memory/providers, none of which depend on mcp.
zerith-tools = { path = "../zerith-tools" }
zerith-security = { path = "../zerith-security" }
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true
# MCP OAuth: PKCE, state and the loopback callback live with the providers'
# OAuth; base64 (already in the tree) for client_secret_basic.
zerith-providers = { path = "../zerith-providers" }
base64 = "0.22"

[dev-dependencies]
tempfile.workspace = true
