name: Zerith release

# Builds portable CLI archives per platform and the signed Windows Tauri 2 NSIS
# desktop installer when a `zerith-v*` tag is pushed (or on manual dispatch,
# which builds and uploads artifacts without publishing a release).
#
#   Windows  zerith-<tag>-windows-x86_64.zip     + .sha256
#   Linux    zerith-<tag>-linux-x86_64.tar.gz    + .sha256
#   macOS    zerith-<tag>-macos-<arch>.tar.gz    + .sha256
#   Windows  Zerith_<ver>_x64-setup.exe          + .sha256 + .sig (Ed25519)
#
# The desktop updater (`crates/zerith-desktop/src/update.rs`) downloads the
# installer from the published release and verifies BOTH `.sha256` and the
# Ed25519 signature (`.sig`) against the public key embedded at build time
# (`ZERITH_UPDATE_PUBKEY` / `crates/zerith-desktop/update-pubkey.txt`).
# Note: OS Authenticode / macOS notarization are separate and not configured yet.

on:
  workflow_dispatch:
  push:
    tags: ['zerith-v*']

concurrency:
  group: zerith-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          # Release and test profiles share dependencies; one cache per OS.
          key: release
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # The updater compares the tag with the version compiled into the app; a
      # tag that disagrees with Cargo.toml or tauri.conf.json would offer the
      # same update forever, so refuse it here.
      - name: Resolve version and verify tag match
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          cargo_ver="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          conf_ver="$(sed -n 's/^  "version": "\(.*\)",/\1/p' crates/zerith-desktop/tauri.conf.json)"
          echo "cargo=${cargo_ver} tauri=${conf_ver}"
          [ -n "$cargo_ver" ] && [ "$cargo_ver" = "$conf_ver" ]
          if [[ "${GITHUB_REF}" == refs/tags/zerith-v* ]]; then
            tag="${GITHUB_REF_NAME#zerith-v}"
            echo "tag=${tag}"
            [ "$tag" = "$cargo_ver" ]
          fi
          echo "version=${cargo_ver}" >> "$GITHUB_OUTPUT"
      - name: Test workspace
        run: cargo test --workspace -j 2
      - name: Build release CLI binary
        run: cargo build --release -p zerith-cli -j 2
      - name: Package portable CLI archive
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-dev}"
          arch="$(uname -m)"
          case "$arch" in x86_64|AMD64) arch=x86_64 ;; arm64|aarch64) arch=arm64 ;; esac
          case "${{ runner.os }}" in
            Windows) os=windows; ext=.exe ;;
            Linux)   os=linux;   ext= ;;
            macOS)   os=macos;   ext= ;;
          esac
          name="zerith-${tag}-${os}-${arch}"
          mkdir -p "dist/${name}"
          cp "target/release/zerith${ext}" "dist/${name}/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md DEPENDENCY_LICENSES.md "dist/${name}/"
          cp docs/release.md docs/build.md docs/aceite.md "dist/${name}/"
          cd dist
          if [ "$os" = windows ]; then
            # Git Bash's tar is GNU tar and cannot write zip; PowerShell can.
            powershell -NoProfile -Command "Compress-Archive -Path '${name}' -DestinationPath '${name}.zip'"
            archive="${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}"
            archive="${name}.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      # Desktop installer (Windows only): Tauri 2 NSIS bundle of zerith-desktop.
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 22
      - name: Prepare Ed25519 update signing key
        if: runner.os == 'Windows'
        shell: bash
        env:
          ZERITH_UPDATE_SIGNING_KEY: ${{ secrets.ZERITH_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ZERITH_UPDATE_SIGNING_KEY}" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/zerith-v* ]]; then
              echo "::error::Secret ZERITH_UPDATE_SIGNING_KEY é obrigatório em releases (tags zerith-v*). Gere com 'node scripts/sign-update.mjs keygen'."
              exit 1
            fi
            echo "::warning::ZERITH_UPDATE_SIGNING_KEY não configurada (execução manual); instalador não terá assinatura .sig."
            exit 0
          fi
          derived_pub="$(node scripts/sign-update.mjs pubkey)"
          file_pub="$(grep -vE '^\s*(#|$)' crates/zerith-desktop/update-pubkey.txt | tr -d '[:space:]' || true)"
          if [ -n "$file_pub" ] && [ "$file_pub" != "$derived_pub" ]; then
            echo "::error::crates/zerith-desktop/update-pubkey.txt não confere com o secret ZERITH_UPDATE_SIGNING_KEY."
            exit 1
          fi
          echo "ZERITH_UPDATE_PUBKEY=${derived_pub}" >> "$GITHUB_ENV"
          echo "Ed25519 update public key verified and exported to build env."
      - name: Desktop frontend dependencies
        if: runner.os == 'Windows'
        shell: bash
        working-directory: crates/zerith-desktop/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build the desktop installer (NSIS)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: crates/zerith-desktop
        # beforeBuildCommand (tauri.conf.json) runs the frontend build first.
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Package and sign the desktop installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          ZERITH_UPDATE_SIGNING_KEY: ${{ secrets.ZERITH_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          src=(target/release/bundle/nsis/*-setup.exe)
          [ "${#src[@]}" -eq 1 ] && [ -f "${src[0]}" ]
          setup="$(basename "${src[0]}")"
          cp "${src[0]}" "dist/${setup}"
          if [ -n "${ZERITH_UPDATE_SIGNING_KEY}" ]; then
            node scripts/sign-update.mjs sign "dist/${setup}" "${{ steps.ver.outputs.version }}"
            node scripts/sign-update.mjs verify "dist/${setup}" "${{ steps.ver.outputs.version }}" "dist/${setup}.sig" "${ZERITH_UPDATE_PUBKEY}"
            cat "dist/${setup}.sha256"
            cat "dist/${setup}.sig"
          else
            (cd dist && sha256sum "$setup" > "${setup}.sha256" && cat "${setup}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zerith-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.sha256
            dist/*.sig
          if-no-files-found: error

  # Only a pushed tag publishes anything; manual runs stop at the artifacts.
  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/zerith-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release notes
        run: |
          {
            echo "## Zerith ${GITHUB_REF_NAME}"
            echo
            echo "Arquivos portáteis do CLI e, no Windows, o instalador do app desktop Tauri 2 (\`Zerith_<versão>_x64-setup.exe\`)."
            echo "O Zerith instalado avisa sozinho quando esta versão for **publicada** (rascunho não aparece para ele) e valida automaticamente tanto o \`.sha256\` quanto a assinatura criptográfica Ed25519 (\`.sig\`)."
            echo
            echo "**Sem certificado Authenticode/notarização de SO**:"
            echo "o Windows SmartScreen e o Gatekeeper do macOS ainda podem avisar na primeira execução manual. Para atualizações dentro do app, o instalador é verificado por assinatura Ed25519 com chave pública embutida."
            echo
            echo "Limitações conhecidas: veja \`docs/aceite.md\`, copiado abaixo."
            echo
            cat docs/aceite.md
          } > RELEASE_NOTES.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --title "Zerith ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --draft
